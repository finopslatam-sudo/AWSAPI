name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      # No bloqueante por ahora: hay deuda de lint preexistente en el repo
      # (ver `ruff check .` localmente). El gate real es el smoke check de abajo.
      - name: Lint (ruff) — informativo
        run: ruff check .
        continue-on-error: true

      - name: Smoke check — sintaxis e imports
        run: python -m compileall -q src app.py

  deploy:
    needs: lint-and-smoke-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy a producción vía SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/finopslatam/AWSAPI

            rollback() {
              echo "❌ $1"
              echo "↩️ Rolling back a $CURRENT_COMMIT..."
              git reset --hard "$CURRENT_COMMIT"
              sudo systemctl restart finops-api
              exit 1
            }

            CURRENT_COMMIT=$(git rev-parse HEAD)

            echo "📥 Fetching latest code..."
            git fetch origin
            git reset --hard origin/main
            echo "📦 Deploying commit:"
            git log -1 --pretty=format:"%h - %s (%ci)"
            echo ""

            source venv/bin/activate

            echo "📦 Installing dependencies..."
            pip install -q -r requirements.txt || rollback "pip install falló"

            echo "🔍 Running backend validation..."
            python scripts/validate_backend.py || rollback "Backend validation falló"

            echo "♻️ Restarting FinOps API..."
            sudo systemctl restart finops-api
            sleep 10

            if ! systemctl is-active --quiet finops-api; then
              rollback "API failed to start"
            fi

            echo "🧪 Running API healthcheck..."
            HEALTH=$(curl -s -H "Host: api.finopslatam.com" http://127.0.0.1:5001/api/health || true)

            if [[ "$HEALTH" != *"healthy"* ]]; then
              rollback "Healthcheck falló"
            fi

            echo "$HEALTH"
            echo "✅ DEPLOY COMPLETED SUCCESSFULLY"
