name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      # No bloqueante por ahora: hay deuda de lint preexistente en el repo
      # (ver `ruff check .` localmente). El gate real es el smoke check de abajo.
      - name: Lint (ruff) — informativo
        run: ruff check .
        continue-on-error: true

      - name: Smoke check — sintaxis e imports
        run: python -m compileall -q src app.py
